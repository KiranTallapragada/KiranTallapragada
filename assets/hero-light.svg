<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Kiran Tallapragada. I build systems where accuracy matters. Qwen3-8B on an NVIDIA L40S: 15.3 GiB weights, 24.1 GiB KV cache, 175,696 tokens, measured with vLLM 0.31.">
<defs>
  <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#efeadf" stroke-width="1"/></pattern>
  <radialGradient id="glow" cx="0.82" cy="0.3" r="0.6"><stop offset="0" stop-color="#f5b942" stop-opacity="0.14"/><stop offset="1" stop-color="#f5b942" stop-opacity="0"/></radialGradient>
  <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#b7791f"/><stop offset="1" stop-color="#c2417f"/></linearGradient>
  <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbfaf7" stop-opacity="0"/><stop offset="1" stop-color="#fbfaf7"/></linearGradient>
</defs>
<style>
  .s{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace;font-size:13px}
  .seg{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
  .s1{animation-delay:1.0s} .s2{animation-delay:1.3s} .s0{animation-delay:.6s}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .up{animation:up .8s ease-out both} .d1{animation-delay:.15s} .d2{animation-delay:.3s} .d3{animation-delay:2.4s}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .cur{animation:blink 1.1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1200" height="340" rx="20" fill="#fbfaf7"/>
<rect width="1200" height="340" rx="20" fill="url(#g)"/>
<rect width="1200" height="340" rx="20" fill="url(#fade)" opacity=".6"/>
<rect width="1200" height="340" rx="20" fill="url(#glow)"/>
<g class="up"><text x="64" y="84" class="m" fill="#b7791f" letter-spacing="3" font-size="13">KIRAN TALLAPRAGADA  ·  AI &amp; PLATFORM ARCHITECT</text></g>
<g class="up d1 s" font-weight="750" font-size="46" letter-spacing="-1.2">
  <text x="62" y="146" fill="#141821">I build systems where</text>
  <text x="62" y="200" fill="url(#hl)">accuracy matters.</text>
</g>
<g class="up d2"><text x="64" y="240" class="s" font-size="18" fill="#4c5566">Self-hosted LLMs, document AI and AWS, backed by measured numbers.</text></g>
<g class="chip"><rect x="64" y="268" width="46" height="28" rx="14" fill="none" stroke="#e4dfd2"/><text x="87" y="287" class="m" fill="#4c5566" text-anchor="middle">vLLM</text></g><g class="chip"><rect x="118.4" y="268" width="92" height="28" rx="14" fill="none" stroke="#e4dfd2"/><text x="164" y="287" class="m" fill="#4c5566" text-anchor="middle">GPU sizing</text></g><g class="chip"><rect x="218.4" y="268" width="100" height="28" rx="14" fill="none" stroke="#e4dfd2"/><text x="268" y="287" class="m" fill="#4c5566" text-anchor="middle">Document AI</text></g><g class="chip"><rect x="326.0" y="268" width="107" height="28" rx="14" fill="none" stroke="#e4dfd2"/><text x="380" y="287" class="m" fill="#4c5566" text-anchor="middle">LLM gateways</text></g><g class="chip"><rect x="441.2" y="268" width="39" height="28" rx="14" fill="none" stroke="#e4dfd2"/><text x="461" y="287" class="m" fill="#4c5566" text-anchor="middle">AWS</text></g><g class="chip"><rect x="488.0" y="268" width="168" height="28" rx="14" fill="none" stroke="#e4dfd2"/><text x="572" y="287" class="m" fill="#4c5566" text-anchor="middle">Regulated industries</text></g>
<g class="up d1">
  <rect x="742" y="44" width="392" height="272" rx="16" fill="#ffffff" stroke="#e4dfd2"/>
  <circle class="pulse" cx="772" cy="86" r="5" fill="#0f8f84"/>
  <text x="786" y="91" class="m" fill="#4c5566">measured · vLLM 0.31</text>
  <text x="1110" y="91" class="m" fill="#6b7890" text-anchor="end">gpu-fit</text>
  <text x="766" y="130" class="s" font-size="20" font-weight="700" fill="#141821">Qwen3-8B on one L40S</text>
  <text x="766" y="156" class="m" fill="#4c5566">vLLM budget 41.4 GiB of 45.0</text>
  <rect x="766" y="176" width="344" height="26" rx="5" fill="#efeadf"/>
  <rect class="seg s0" x="766.0" y="176" width="124.9" height="26" rx="4" fill="#b7791f"/><rect class="seg s1" x="892.9" y="176" width="14.5" height="26" rx="4" fill="#6d4fd8"/><rect class="seg s2" x="909.4" y="176" width="198.6" height="26" rx="4" fill="#0f8f84"/>
  <rect x="766" y="221" width="10" height="10" rx="2" fill="#b7791f"/><text x="784" y="230" class="m" fill="#4c5566">weights</text><text x="1110" y="230" class="m" fill="#141821" text-anchor="end">15.3 GiB</text><rect x="766" y="241" width="10" height="10" rx="2" fill="#6d4fd8"/><text x="784" y="250" class="m" fill="#4c5566">runtime</text><text x="1110" y="250" class="m" fill="#141821" text-anchor="end">2.0 GiB</text><rect x="766" y="261" width="10" height="10" rx="2" fill="#0f8f84"/><text x="784" y="270" class="m" fill="#4c5566">KV cache</text><text x="1110" y="270" class="m" fill="#141821" text-anchor="end">24.1 GiB</text>
</g>
<g class="up d3"><text x="766" y="300" class="m" font-size="12" style="font-size:12px" fill="#141821">✓ fits · 175,696 KV tokens · 5.4 requests at 32K</text></g>
</svg>
